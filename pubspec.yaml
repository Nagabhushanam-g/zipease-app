name: zipease
description: Free offline ZIP and unzip utility for Android with AdMob test ads.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.6.0
  file_picker: ^13.3.3
  google_mobile_ads: ^9.2.0
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
