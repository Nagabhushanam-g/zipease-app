name: Build ZipEase APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: zipease-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out ZipEase
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project and configure AdMob test ID
        run: bash tool/bootstrap_android.sh

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload the installable APK
        uses: actions/upload-artifact@v4
        with:
          name: zipease-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Keep only the newest 10 successful ZipEase APK artifacts
        if: success()
        uses: actions/github-script@v7
        with:
          script: bash tool/smoke_launch.sh

      - name: Upload launcher screenshot and Android logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zipease-launch-check-${{ github.run_number }}
          path: |
            zipease-launch.log
            zipease-launch.png
          if-no-files-found: ignore
          retention-days: 3
