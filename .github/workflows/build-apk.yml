name: Build ZipEase APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: zipease-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out ZipEase
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project and configure AdMob test ID
        run: bash tool/bootstrap_android.sh

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

      - name: Restore the permanent ZipEase release signing key
        env:
          ZIPEASE_RELEASE_KEYSTORE_BASE64: ${{ secrets.ZIPEASE_RELEASE_KEYSTORE_BASE64 }}
          ZIPEASE_RELEASE_PASSWORD: ${{ secrets.ZIPEASE_RELEASE_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "${ZIPEASE_RELEASE_KEYSTORE_BASE64:-}" || -z "${ZIPEASE_RELEASE_PASSWORD:-}" ]]; then
            echo "::error::Missing permanent release signing secrets. Follow docs/ANDROID_SIGNING_SETUP.md. Do not distribute builds signed with a new debug key."
            exit 1
          fi
          umask 077
          KEYSTORE="$RUNNER_TEMP/zipease-release.p12"
          printf '%s' "$ZIPEASE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass "$ZIPEASE_RELEASE_PASSWORD" -alias zipease >/dev/null
          EXPECTED_FINGERPRINT="36:79:85:1B:F5:5D:7A:48:9C:71:64:0F:A3:2B:8C:88:E0:28:CD:AF:8C:27:FB:16:F6:94:5B:D7:F6:1D:F0:E3"
          ACTUAL_FINGERPRINT="$(keytool -list -v -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass "$ZIPEASE_RELEASE_PASSWORD" -alias zipease \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1)"
          if [[ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]]; then
            echo "::error::Wrong release signing key. Updating with it would fail and corrupt our signing continuity."
            exit 1
          fi
          echo "ZIPEASE_RELEASE_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Verified permanent release certificate fingerprint."

      - name: Build Android release APK
        env:
          ZIPEASE_RELEASE_PASSWORD: ${{ secrets.ZIPEASE_RELEASE_PASSWORD }}
        run: flutter build apk --release --build-number="$GITHUB_RUN_NUMBER"

      - name: Upload the installable APK
        uses: actions/upload-artifact@v4
        with:
          name: zipease-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Keep only the newest 10 successful ZipEase APK artifacts
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const successfulRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'build-apk.yml', status: 'success', per_page: 100,
            });
            const successfulIds = new Set(successfulRuns.map(run => run.id));
            // Current build has passed upload but this workflow is still running.
            successfulIds.add(context.runId);
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, per_page: 100,
            });
            const completedArtifacts = artifacts
              .filter(a => a.name.startsWith('zipease-apk-') && !a.expired &&
                a.workflow_run && successfulIds.has(a.workflow_run.id))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const artifact of completedArtifacts.slice(10)) {
              await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
              core.info(`Deleted old ZipEase artifact: ${artifact.name}`);
            }
            core.info(`Retained ${Math.min(10, completedArtifacts.length)} successful APK artifact(s).`);

  smoke-launch:
    name: Android launch smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out ZipEase
        uses: actions/checkout@v4

      - name: Download APK from this build
        uses: actions/download-artifact@v4
        with:
          name: zipease-apk-${{ github.run_number }}
          path: smoke-apk

      - name: Enable hardware acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and cold-start APK on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash tool/smoke_launch.sh

      - name: Upload launcher screenshot and Android logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zipease-launch-check-${{ github.run_number }}
          path: |
            zipease-launch.log
            zipease-launch.png
          if-no-files-found: ignore
          retention-days: 3
